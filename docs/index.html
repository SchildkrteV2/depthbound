<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#120f1a">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<title>Ghostbound</title>
	<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #120f1a; color: #e8e2ff; overflow: hidden; touch-action: none; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
/* Ghostbound loading screen (replaces Godot's splash) */
#loader { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 40%, #241c38 0%, #120f1a 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 10; transition: opacity 0.35s ease; }
#loader.done { opacity: 0; pointer-events: none; }
#ghost { width: 64px; height: 76px; animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
#title { font-size: clamp(26px, 6vw, 44px); font-weight: 800; letter-spacing: 0.12em; color: #d9d0ff; text-shadow: 0 2px 0 #3a2d5c; }
#bar { width: min(320px, 60vw); height: 8px; border-radius: 4px; background: #2a2340; overflow: hidden; }
#fill { width: 0%; height: 100%; background: linear-gradient(90deg, #8f7bff, #c7b8ff); border-radius: 4px; transition: width 0.2s ease; }
#fill.indeterminate { width: 35%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
#tag { font-size: 13px; color: #7fd8e8; opacity: 0.8; margin-top: -10px; text-align: center; padding: 0 20px; }
#msg { font-size: 13px; color: #9a90c0; min-height: 1em; text-align: center; padding: 0 20px; }
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	<noscript>Your browser does not support JavaScript.</noscript>
	<div id="loader">
		<svg id="ghost" viewBox="0 0 32 38" shape-rendering="crispEdges" aria-hidden="true">
			<path d="M16 2 C8 2 4 8 4 15 L4 24 C4 28 8 31 12 32 L10 36 L16 33 C24 32 28 27 28 20 L28 15 C28 8 24 2 16 2 Z" fill="#eef0ff" stroke="#120f1a" stroke-width="1.5"/>
			<ellipse cx="13" cy="15" rx="2" ry="3" fill="#1a1824"/>
			<ellipse cx="20" cy="15" rx="2.3" ry="3.3" fill="#1a1824"/>
			<ellipse cx="17" cy="22" rx="1.6" ry="1.4" fill="#1a1824"/>
		</svg>
		<div id="title">GHOSTBOUND</div>
		<div id="tag">You died on floor 999. Your body is still down there.</div>
		<div id="bar"><div id="fill"></div></div>
		<div id="msg">Loading...</div>
	</div>
	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1288476,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const fill = document.getElementById('fill');
	const msg = document.getElementById('msg');
	let hidden = false;

	// The game calls this once its main menu is up (see main.gd), so players never see a
	// blank screen or the engine's own splash in between.
	function hideLoader() {
		if (hidden) return;
		hidden = true;
		loader.classList.add('done');
		setTimeout(() => loader.remove(), 400);
	}
	window.depthboundReady = hideLoader;

	function fail(err) {
		console.error(err);
		fill.classList.remove('indeterminate');
		msg.textContent = (err && err.message) ? err.message : String(err);
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			Promise.race([
				navigator.serviceWorker.getRegistration().then((r) => r != null ? Promise.reject(new Error('exists')) : r).then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(resolve, 2000)),
			]).then(() => window.location.reload()).catch((err) => console.error(err));
		} else {
			fail('Your browser is missing features needed to run the game:\n' + missing.join(', '));
		}
		return;
	}

	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.min(100, Math.round(current / total * 100));
				fill.classList.remove('indeterminate');
				fill.style.width = pct + '%';
				msg.textContent = pct < 100 ? 'Loading... ' + pct + '%' : 'Waking the ghost...';
			}
		},
	}).then(() => {
		// Engine is running; it is now loading the game itself. Keep our screen up until the
		// game says it's ready (or a safety timeout).
		fill.style.width = '100%';
		msg.textContent = 'Waking the ghost...';
		setTimeout(hideLoader, 20000);
	}, fail);

	// Register the service worker so later launches load straight from the device cache.
	if (GODOT_CONFIG['serviceWorker'] && 'serviceWorker' in navigator) {
		navigator.serviceWorker.register(GODOT_CONFIG['serviceWorker']).catch(() => {});
	}
}());
	</script>
</body>
</html>
